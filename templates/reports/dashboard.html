{% extends 'base.html' %}
{% block title %}Reports{% endblock %}
{% block page_title %}Reports{% endblock %}
{% block content %}
<div class="row g-3">
    <div class="col-md-4">
        <a href="{% url 'admission_reports' %}" class="card text-decoration-none">
            <div class="card-body text-center py-4">
                <i class="bi bi-journal-check text-primary" style="font-size:36px"></i>
                <h5 class="mt-3">Admission Reports</h5>
                <p class="text-muted mb-0">Date-wise, university-wise, course-wise</p>
            </div>
        </a>
    </div>
    <div class="col-md-4">
        <a href="{% url 'enquiry_reports' %}" class="card text-decoration-none">
            <div class="card-body text-center py-4">
                <i class="bi bi-chat-dots text-success" style="font-size:36px"></i>
                <h5 class="mt-3">Enquiry Reports</h5>
                <p class="text-muted mb-0">Conversion rate, source-wise</p>
            </div>
        </a>
    </div>
    <div class="col-md-4">
        <a href="{% url 'fee_reports' %}" class="card text-decoration-none">
            <div class="card-body text-center py-4">
                <i class="bi bi-cash-stack text-warning" style="font-size:36px"></i>
                <h5 class="mt-3">Fee Reports</h5>
                <p class="text-muted mb-0">Collection, pending, date-range</p>
            </div>
        </a>
    </div>
</div>
{% endblock %}
