{% extends 'base.html' %}
{% block title %}Delete Course - RENIC ERP{% endblock %}
{% block page_title %}Delete Course{% endblock %}
{% block content %}
<div class="breadcrumb-bar">
    <div class="breadcrumb">
        <a href="{% url 'dashboard' %}">Dashboard</a>
        <span class="separator">/</span>
        <a href="{% url 'course_list' %}">Courses</a>
        <span class="separator">/</span>
        <span class="current">Delete</span>
    </div>
</div>

<div class="card" style="max-width:450px">
    <div class="card-body text-center py-4">
        <div class="stat-card-icon red" style="width:56px;height:56px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:16px"><i class="bi bi-exclamation-triangle"></i></div>
        <h5 class="mb-2">Delete {{ object.name }}?</h5>
        <p style="color:var(--text-muted);font-size:13px;margin-bottom:24px">This action cannot be undone.</p>
        <form method="POST" class="d-flex gap-2 justify-content-center">
            {% csrf_token %}
            <a href="{% url 'course_list' %}" class="btn btn-secondary">Cancel</a>
            <button type="submit" class="btn btn-danger"><i class="bi bi-trash"></i> Delete</button>
        </form>
    </div>
</div>
{% endblock %}
