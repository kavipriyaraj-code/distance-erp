<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Done - RENIC ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:linear-gradient(135deg,#0f172a,#1e40af);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif}
        .login-card{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center}
        .login-card h3{font-weight:700;color:#0f172a;margin-bottom:12px}
        .login-card p{color:#64748b;font-size:14px;margin-bottom:24px}
        .brand-icon{width:60px;height:60px;background:#d1fae5;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;color:#059669}
        .btn-login{padding:12px 32px;font-weight:600;border-radius:10px;background:#2563eb;border:none;font-size:14px;color:#fff;text-decoration:none;display:inline-block}
        .btn-login:hover{background:#1d4ed8;color:#fff}
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-icon"><i class="bi bi-check-lg"></i></div>
        <h3>Password Reset Successful</h3>
        <p>Your password has been reset. You can now login with your new password.</p>
        <a href="{% url 'login' %}" class="btn-login">Go to Login</a>
    </div>
</body>
</html>
