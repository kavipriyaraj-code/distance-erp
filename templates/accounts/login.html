<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - RENIC ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:linear-gradient(135deg,#0f172a,#1e40af);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif}
        .login-card{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
        .login-card h3{text-align:center;font-weight:700;color:#0f172a;margin-bottom:6px}
        .login-card .sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:28px}
        .form-floating{margin-bottom:16px}
        .form-floating .form-control{border-radius:10px;padding:14px 12px;height:48px}
        .btn-login{width:100%;padding:12px;font-weight:600;border-radius:10px;background:#2563eb;border:none;font-size:14px}
        .btn-login:hover{background:#1d4ed8}
        .brand-icon{width:60px;height:60px;background:#eff6ff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;color:#2563eb}
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-icon"><i class="bi bi-mortarboard"></i></div>
        <h3>RENIC TECH</h3>
        <p class="sub">Distance Education ERP</p>
        {% if form.errors %}
        <div class="alert alert-danger py-2" style="font-size:13px;border-radius:8px">Invalid username or password.</div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="form-floating">
                <input type="text" name="username" class="form-control" id="username" placeholder="Username" required autofocus>
                <label for="username">Username</label>
            </div>
            <div class="form-floating">
                <input type="password" name="password" class="form-control" id="password" placeholder="Password" required>
                <label for="password">Password</label>
            </div>
            <button type="submit" class="btn btn-login text-white mt-2">Sign In</button>
        </form>
    </div>
</body>
</html>
