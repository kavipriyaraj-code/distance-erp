<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - RENIC ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{background:linear-gradient(135deg,#0f172a,#1e40af);min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif}
        .login-card{width:100%;max-width:400px;background:#fff;border-radius:16px;padding:40px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
        .login-card h3{text-align:center;font-weight:700;color:#0f172a;margin-bottom:6px}
        .login-card .sub{text-align:center;color:#64748b;font-size:13px;margin-bottom:28px}
        .form-floating{margin-bottom:16px}
        .form-floating .form-control{border-radius:10px;padding:14px 12px;height:48px}
        .btn-login{width:100%;padding:12px;font-weight:600;border-radius:10px;background:#2563eb;border:none;font-size:14px;color:#fff}
        .btn-login:hover{background:#1d4ed8;color:#fff}
        .brand-icon{width:60px;height:60px;background:#eff6ff;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;color:#2563eb}
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-icon"><i class="bi bi-lock"></i></div>
        <h3>Set New Password</h3>
        <p class="sub">Enter your new password below.</p>
        {% if form.errors %}
        <div class="alert alert-danger py-2" style="font-size:13px;border-radius:8px">
            {% for field, errors in form.errors.items %}
            {% for error in errors %}{{ error }}{% endfor %}
            {% endfor %}
        </div>
        {% endif %}
        <form method="POST">
            {% csrf_token %}
            <div class="form-floating">
                <input type="password" name="new_password1" class="form-control" id="new_password1" placeholder="New Password" required>
                <label for="new_password1">New Password</label>
            </div>
            <div class="form-floating">
                <input type="password" name="new_password2" class="form-control" id="new_password2" placeholder="Confirm Password" required>
                <label for="new_password2">Confirm Password</label>
            </div>
            <button type="submit" class="btn btn-login mt-2">Reset Password</button>
            <div class="text-center mt-3">
                <a href="{% url 'login' %}" style="color:#2563eb;font-size:13px;text-decoration:none"><i class="bi bi-arrow-left"></i> Back to Login</a>
            </div>
        </form>
    </div>
</body>
</html>
