{% extends 'base.html' %}
{% block title %}Delete User{% endblock %}
{% block page_title %}Delete User{% endblock %}
{% block content %}
<div class="card" style="max-width:400px">
    <div class="card-body text-center py-4">
        <i class="bi bi-exclamation-triangle text-danger" style="font-size:48px"></i>
        <h5 class="mt-3">Are you sure?</h5>
        <p class="text-muted">Delete user <strong>{{ target_user.username }}</strong>? This cannot be undone.</p>
        <form method="POST">
            {% csrf_token %}
            <div class="d-flex gap-2 justify-content-center">
                <button type="submit" class="btn btn-danger">Delete</button>
                <a href="{% url 'user_list' %}" class="btn btn-cancel">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
