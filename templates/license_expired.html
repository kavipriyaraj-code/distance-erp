<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>License Expired - RENIC ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',system-ui,-apple-system,sans-serif;background:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;color:#1e293b}
        .expired-card{background:#fff;border-radius:16px;padding:48px 40px;max-width:480px;width:90%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)}
        .expired-icon{width:80px;height:80px;border-radius:50%;background:#fef2f2;display:inline-flex;align-items:center;justify-content:center;margin-bottom:24px}
        .expired-icon i{font-size:36px;color:#dc2626}
        h1{font-size:22px;font-weight:700;color:#0f172a;margin-bottom:8px}
        .subtitle{color:#64748b;font-size:14px;margin-bottom:24px;line-height:1.6}
        .detail-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:16px;margin:20px 0;text-align:left}
        .detail-row{display:flex;justify-content:space-between;padding:6px 0}
        .detail-label{color:#64748b;font-size:13px}
        .detail-value{font-weight:600;font-size:13px;color:#1e293b}
        .status-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;background:#fef2f2;color:#dc2626;border:1px solid #fecaca}
        .status-dot{width:8px;height:8px;border-radius:50%;background:#dc2626}
        .btn-login{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:8px;background:#0f172a;color:#fff;text-decoration:none;font-weight:600;font-size:14px;border:none;cursor:pointer;transition:.2s;margin-top:16px}
        .btn-login:hover{background:#1e293b}
        .footer-note{color:#94a3b8;font-size:12px;margin-top:24px}
    </style>
</head>
<body>
    <div class="expired-card">
        <div class="expired-icon"><i class="bi bi-shield-x"></i></div>
        <h1>ERP LICENSE EXPIRED</h1>
        <p class="subtitle">Your ERP license has expired. Please contact the system administrator to renew the license.</p>

        <div class="detail-box">
            <div class="detail-row">
                <span class="detail-label">Status</span>
                <span class="status-badge"><span class="status-dot"></span> EXPIRED</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">License Expired</span>
                <span class="detail-value">{{ expiry_date|default:"N/A" }}</span>
            </div>
        </div>

        <a href="{% url 'login' %}" class="btn-login"><i class="bi bi-box-arrow-left"></i> Back to Login</a>
        <p class="footer-note">RENIC TECH - Distance Education ERP</p>
    </div>
</body>
</html>
